<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner Result Preview</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .preview-container {
            max-width: 600px;
            width: 100%;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        
        .qr-result {
            text-align: center;
            animation: slideInUp 0.5s ease-out;
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .qr-result-header {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .qr-success-icon {
            font-size: 48px;
            animation: bounce 0.6s ease-in-out;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        .qr-result-header h3 {
            color: #27ae60;
            font-size: 28px;
            margin: 0;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(39, 174, 96, 0.2);
        }
        
        .qr-result-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(39, 174, 96, 0.1);
            text-align: left;
        }
        
        .qr-artist-info {
            margin-bottom: 25px;
        }
        
        .qr-info-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(39, 174, 96, 0.05);
            border-radius: 12px;
            border-left: 4px solid #27ae60;
        }
        
        .qr-label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
            min-width: 80px;
            margin-right: 15px;
        }
        
        .qr-value {
            font-size: 18px;
            font-weight: 500;
        }
        
        .qr-value.artist-name {
            color: #e74c3c;
            font-weight: 700;
        }
        
        .qr-value.event-name {
            color: #3498db;
            font-weight: 700;
        }
        
        .qr-status-badge {
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .qr-status-badge.confirmed {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .qr-event-details {
            border-top: 2px solid #e9ecef;
            padding-top: 25px;
        }
        
        .qr-detail-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(52, 152, 219, 0.05);
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        
        .qr-detail-item:hover {
            background: rgba(52, 152, 219, 0.1);
            transform: translateX(5px);
        }
        
        .qr-detail-icon {
            font-size: 24px;
            margin-right: 15px;
            width: 40px;
            text-align: center;
        }
        
        .qr-detail-text {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        
        .qr-detail-label {
            font-size: 12px;
            color: #6c757d;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .qr-detail-value {
            font-size: 16px;
            color: #2c3e50;
            font-weight: 500;
        }
        
        .qr-result-actions {
            display: flex;
            justify-content: center;
        }
        
        .qr-rescan-button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .qr-rescan-button:hover {
            background: linear-gradient(135deg, #2980b9 0%, #1f618d 100%);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <div class="qr-result">
            <div class="qr-result-header">
                <div class="qr-success-icon">✅</div>
                <h3>QR Code Verified</h3>
            </div>
            
            <div class="qr-result-card">
                <div class="qr-artist-info">
                    <div class="qr-info-row">
                        <span class="qr-label">Artist:</span>
                        <span class="qr-value artist-name">Lashi Perera</span>
                    </div>
                    
                    <div class="qr-info-row">
                        <span class="qr-label">Event:</span>
                        <span class="qr-value event-name">Pottery Workshop</span>
                    </div>
                    
                    <div class="qr-info-row">
                        <span class="qr-label">Status:</span>
                        <span class="qr-status-badge confirmed">✅ Registered & Confirmed</span>
                    </div>
                </div>
                
                <div class="qr-event-details">
                    <div class="qr-detail-item">
                        <div class="qr-detail-icon">📅</div>
                        <div class="qr-detail-text">
                            <span class="qr-detail-label">Event Date</span>
                            <span class="qr-detail-value">Friday, October 10, 2025</span>
                        </div>
                    </div>
                    
                    <div class="qr-detail-item">
                        <div class="qr-detail-icon">📍</div>
                        <div class="qr-detail-text">
                            <span class="qr-detail-label">Venue</span>
                            <span class="qr-detail-value">Colombo Art Center</span>
                        </div>
                    </div>
                    
                    <div class="qr-detail-item">
                        <div class="qr-detail-icon">🆔</div>
                        <div class="qr-detail-text">
                            <span class="qr-detail-label">Registration ID</span>
                            <span class="qr-detail-value">REG-1760104987062-F6QM8S42C</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="qr-result-actions">
                <button class="qr-rescan-button">
                    🔄 Scan Another QR Code
                </button>
            </div>
        </div>
    </div>
</body>
</html>
